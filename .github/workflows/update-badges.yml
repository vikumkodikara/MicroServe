name: Update badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - bugfix/main-sync

permissions:
  contents: write

jobs:
  update-badges:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch counts and generate badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p badges
          STARS=$(gh api "repos/${{ github.repository }}" --jq .stargazers_count)
          FORKS=$(gh api "repos/${{ github.repository }}" --jq .forks_count)
          curl -fsSL "https://img.shields.io/badge/stars-${STARS}-181717?logo=github&logoColor=white" -o badges/stars.svg
          curl -fsSL "https://img.shields.io/badge/forks-${FORKS}-181717?logo=github&logoColor=white" -o badges/forks.svg

      - name: Commit and push badge updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/stars.svg badges/forks.svg
          if git diff --staged --quiet; then
            echo "Badges unchanged, skipping commit."
          else
            git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "Update stars/forks badges [skip ci]"
            git push
          fi
